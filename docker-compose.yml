services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: weekset
      POSTGRES_PASSWORD: weekset
      POSTGRES_DB: weekset
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekset -d weekset"]
      interval: 2s
      timeout: 5s
      retries: 30
